name: keep-alive

# Supabase pauses free projects after 7 days without user/API activity; pg_cron
# jobs do not count. /titulos renders per request and queries Supabase.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 https://coronateonline.vercel.app/titulos -o /dev/null
